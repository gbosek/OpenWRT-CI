#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_NPU:
        required: false
        default: naoki
        type: string
      WRT_MWAN:
        required: false
        default: mwan4
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_REVISION:
        required: false
        default: ''
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_NPU: ${{inputs.WRT_NPU}}
  WRT_MWAN: ${{inputs.WRT_MWAN}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_REVISION: ${{inputs.WRT_REVISION}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}} / ${{inputs.WRT_NPU}}
    runs-on: ubuntu-24.04
    outputs:
      cache_prefix: ${{steps.initialize-values.outputs.cache_prefix}}
      cache_key: ${{steps.clone-code.outputs.cache_key}}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Check compatibility boost and NPU adapters
        run: |
          python3 CPU/tests/run.py
          python3 Packages/xg2010g-rps/tests/rps-test.py
          python3 CPU/tests/pon-selection-test.py
          python3 UI/tests/pon-install-test.py
          python3 CPU/tests/driver-fixes-test.py
          node UI/tests/overview-test.js
          python3 Runtime/tests/runtime-test.py
          python3 Runtime/tests/route-test.py
          node Runtime/tests/export-test.js

      - name: Cancel superseded boost builds
        if: endsWith(github.ref_name, '-boost')
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const {owner, repo} = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'OWRT-ALL.yml', branch, per_page: 100
            });
            for (const run of runs) {
              if (run.id >= context.runId || run.head_sha === context.sha || !['queued', 'in_progress'].includes(run.status)) continue;
              await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
              core.info(`Superseded boost build cancelled: ${run.id}`);
            }

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        id: initialize-values
        run: |
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[^=_]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[^=_]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"
          WRT_WIFI=$(grep -oE 'WIFI-(YES|NO)$' <<< "${WRT_CONFIG^^}" || true); WRT_WIFI=${WRT_WIFI:-none}
          case "$WRT_MWAN" in
            mwan4)
              WRT_VARIANT=MOSSDEF-MWAN4-PPE
              WRT_MWAN_LABEL=MWAN4
              WRT_MWAN_SOURCE_FILE=MWAN4-SOURCE.json
              ;;
            mwan3-nft)
              WRT_VARIANT=MWAN3-NFT-PPE
              WRT_MWAN_LABEL=MWAN3-nft
              WRT_MWAN_SOURCE_FILE=MWAN3-SOURCE.json
              ;;
            *) echo "::error::Unsupported multi-WAN variant: $WRT_MWAN"; exit 1 ;;
          esac

          {
            echo "WRT_INFO=${WRT_SOURCE%%/*}-$WRT_VARIANT-${WRT_NPU^^}-COMPAT1400"
            echo "WRT_MWAN_LABEL=$WRT_MWAN_LABEL"
            echo "WRT_MWAN_SOURCE_FILE=$WRT_MWAN_SOURCE_FILE"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_WIFI=$WRT_WIFI"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Clone Code
        id: clone-code
        run: |
          git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" ./wrt/

          cd ./wrt/
          if [ -n "$WRT_REVISION" ]; then
            git fetch --depth=1 origin "$WRT_REVISION"
            git checkout --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$WRT_REVISION"
          fi
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> $GITHUB_ENV
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> $GITHUB_ENV
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Restore Build Cache
        id: cache-restore
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          restore-keys: ${{env.WRT_CACHE_PREFIX}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Prepare Restored Build Cache
        if: ${{ !inputs.WRT_TEST && steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p ./wrt/tmp
          echo "1" > ./wrt/tmp/.build
          echo "restored build cache: ${{steps.cache-restore.outputs.cache-matched-key}}"

      - name: Update Feeds
        run: |
          cd ./wrt/

          python3 "$GITHUB_WORKSPACE/Scripts/select-pon.py" . --variant "$WRT_NPU" --phase feed
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc) && make clean -j$(nproc)
          if [[ "$WRT_CONFIG" == AIROHA ]]; then python3 "$GITHUB_WORKSPACE/Scripts/check-runtime-config.py" .; fi

          if [[ "$WRT_CONFIG" == "AIROHA" ]]; then
            python3 "$GITHUB_WORKSPACE/Scripts/check-mwan-build.py" --variant "$WRT_MWAN" --config .config
            python3 "$GITHUB_WORKSPACE/Scripts/check-pon-build.py" . --variant "$WRT_NPU" --config-only
          fi

      - name: Download Packages
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Prepare and verify upstream driver fixes
        if: ${{ !inputs.WRT_TEST && inputs.WRT_CONFIG == 'AIROHA' }}
        run: |
          cd ./wrt/
          make target/linux/prepare -j2 V=s
          python3 "$GITHUB_WORKSPACE/Scripts/check-driver-fixes.py" --build-dir build_dir

      - name: Compile Firmware
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          make -j$(nproc) || make -j1 V=s

      - name: Verify PPE v2 in compiled kernel
        if: ${{ !inputs.WRT_TEST && inputs.WRT_CONFIG == 'AIROHA' }}
        run: |
          cd ./wrt/
          python3 "$GITHUB_WORKSPACE/Scripts/check-ppe-build.py" \
            --manifest-dir ./bin/targets/airoha/an7581 --build-dir ./build_dir

      - name: Verify latest Airoha and four-core MWAN4 image
        if: ${{ !inputs.WRT_TEST && inputs.WRT_CONFIG == 'AIROHA' && inputs.WRT_MWAN == 'mwan4' }}
        run: |
          python3 "$GITHUB_WORKSPACE/Scripts/check-xg2010g-build.py" ./wrt
          python3 "$GITHUB_WORKSPACE/Scripts/check-compatible-boost.py" ./wrt
          python3 "$GITHUB_WORKSPACE/Scripts/check-pon-build.py" ./wrt --variant "$WRT_NPU"
          python3 "$GITHUB_WORKSPACE/Scripts/check-driver-fixes.py" --build-dir ./wrt/build_dir --compiled --report ./wrt/bin/targets/airoha/an7581/AN7581-DRIVER-FIXES-VERIFICATION.json

      - name: Verify PON layout with actual firmware themes
        id: pon-layout
        if: ${{ !inputs.WRT_TEST && inputs.WRT_CONFIG == 'AIROHA' }}
        run: |
          npm ci --prefix "$GITHUB_WORKSPACE/UI/tests" --ignore-scripts --no-audit --no-fund
          node "$GITHUB_WORKSPACE/UI/tests/node_modules/playwright/cli.js" install --with-deps --only-shell chromium
          PON_ROOT="$(python3 -c 'from pathlib import Path; roots=list(Path("wrt/build_dir").glob("target-*/root-airoha")); assert len(roots)==1, roots; print(roots[0].resolve())')"
          PON_TEST_ROOT="$PON_ROOT" \
          PON_TEST_SCREENSHOTS="$RUNNER_TEMP/pon-layout/screenshots" \
          PON_TEST_OUTPUT="$RUNNER_TEMP/pon-layout/results" \
            node "$GITHUB_WORKSPACE/UI/tests/node_modules/playwright/cli.js" test --config="$GITHUB_WORKSPACE/UI/tests/playwright.config.js"

      - name: Upload PON layout verification
        if: always() && (steps.pon-layout.outcome == 'success' || steps.pon-layout.outcome == 'failure')
        uses: actions/upload-artifact@v5
        with:
          name: PON-layout-${{ env.WRT_NPU }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pon-layout
          retention-days: 14

      - name: Save Build Cache
        if: ${{ !inputs.WRT_TEST && success() && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          if [[ "$WRT_CONFIG" == "AIROHA" && "$WRT_TEST" != 'true' ]]; then
            manifest=./bin/targets/airoha/an7581/immortalwrt-airoha-an7581.manifest
            if [[ ! -f "$manifest" ]]; then
              manifest=$(find ./bin/targets/airoha/an7581 -maxdepth 1 -name '*.manifest' -print -quit)
            fi
            [[ -n "$manifest" && -f "$manifest" ]] || { echo '::error::Firmware manifest missing'; exit 1; }
            python3 "$GITHUB_WORKSPACE/Scripts/check-mwan-build.py" --variant "$WRT_MWAN" --manifest "$manifest"
          fi

          cp ./files/etc/airoha-build-source.json ./upload/AIROHA-SOURCE.json
          cp ./files/etc/an7581-driver-fixes.json ./upload/AN7581-DRIVER-FIXES-SOURCE.json
          cp ./bin/targets/airoha/an7581/AN7581-DRIVER-FIXES-VERIFICATION.json ./upload/
          cp ./files/etc/pon-status-layout.json ./upload/PON-STATUS-LAYOUT.json
          if [ -f ./files/etc/pon-build-source.json ]; then cp ./files/etc/pon-build-source.json ./upload/PON-SOURCE.json; fi
          cp "$GITHUB_WORKSPACE/CPU-BOOST-SOURCE.json" ./upload/
          cp "$GITHUB_WORKSPACE/CPU-USAGE-SOURCE.json" ./upload/
          cp "$GITHUB_WORKSPACE/PLUGIN-COMPATIBILITY-VALIDATION.json" ./upload/
          cp "$GITHUB_WORKSPACE/kernel-patches/airoha/999-xg2010g-bl31-compatible-overclock.patch" ./upload/
          cp "$GITHUB_WORKSPACE/$WRT_MWAN_SOURCE_FILE" "./upload/$WRT_MWAN_SOURCE_FILE"
          cp "$GITHUB_WORKSPACE/kernel-patches/airoha/931-net-airoha-keep-PPE-offload-when-NPU-refuses-flow-stats.patch" ./upload/
          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ "$WRT_TEST" != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            XG2010G ${{env.WRT_MWAN_LABEL}} 专用固件：仅编译 Gemtek XG2010G。
            多 WAN 方案：${{env.WRT_MWAN_LABEL}}，准确来源见附件 ${{env.WRT_MWAN_SOURCE_FILE}}。
            包含多 WAN 中文界面、${{env.WRT_NPU}} NPU LuCI（准确来源见 AIROHA-SOURCE.json）、ttyd 中文界面、仓库原生四核 CPU 使用率、RPS 重启恢复、500–1400MHz 动态兼容超频（新实现，硬件稳定性未验证）和现有温度/PON 状态页。
            已加入 [PATCH net v2] net: airoha: keep PPE offload when NPU refuses flow stats。
            内核更新到 6.18.55，保留 QDMA 配置重试；NPU 看门狗释放顺序与 RX31 修复由原生内核提供，不重复打补丁。发布前核对实际源码、ARM64 对象与安装后的版本记录。
            包含 PON fullwidth-v2 满宽布局、MWAN4 停止反馈及 RPS 单实例修复。
            已修复 naoki ONU 对 firewall4 zone-device 卸载补丁的依赖，保留原 FullCone；共享 cpufreq 恢复原 ondemand 参数。
            CONFIG_NET_AIROHA_FLOW_STATS=y；发布前检查内核源码、编译对象和固件软件包清单。
            切换多 WAN 实现后，需要按当前线路重新设置接口和策略。
            硬件卸载和双 WAN 功能仍需刷入后实机确认。

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}
            构建配置提交：${{github.sha}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

  cache-rollover:
    name: Roll cache generations
    needs: core
    if: ${{ !inputs.WRT_TEST && needs.core.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: wrt-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
    steps:
      - name: Roll Build Cache
        run: |
          set -euo pipefail

          CURRENT_CACHE_KEYS=$(gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_KEY" --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key')
          CURRENT_CACHE_FOUND=0
          while IFS= read -r CACHE_KEY; do
            if [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ]; then
              CURRENT_CACHE_FOUND=1
              break
            fi
          done <<< "$CURRENT_CACHE_KEYS"

          if [ "$CURRENT_CACHE_FOUND" -ne 1 ]; then
            echo "skip cache rollover: current cache is not available yet"
            exit 0
          fi

          gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_PREFIX-" --ref "$GITHUB_REF" --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' |
            while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
              [ -n "$CACHE_ID" ] || continue
              [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ] && continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                echo "warning: failed to delete cache $CACHE_ID ($CACHE_KEY)"
            done

#CI项目
name: AIROHA-ALL

#CI计划
on:
  #手动编译
  workflow_dispatch:
    inputs:
      DIAGNOSE:
        description: 'Inspect a previous failed run'
        type: boolean
        default: false
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

#CI权限
permissions: write-all

#CI任务
jobs:
  diagnose:
    if: ${{ inputs.DIAGNOSE }}
    runs-on: ubuntu-latest
    steps:
      - name: Read previous job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api --allow-escape-sequences repos/${{ github.repository }}/actions/jobs/126438619136/logs > /tmp/xg-log 2>/tmp/xg-error
          result=$?
          echo "::notice::Log retrieval exit: $result; bytes: $(wc -c </tmp/xg-log)"
          if [ "$result" != 0 ]; then
            python3 - <<'PYCODE'
          from pathlib import Path
          text = Path('/tmp/xg-error').read_text(errors='replace')
          print('::error::Log download failed: ' + ('Forbidden or inaccessible storage' if 'Forbidden' in text else text[:300].replace('%', '%25').replace('\n', ' ')))
          PYCODE
            exit "$result"
          fi
          python3 - <<'PYCODE'
          from pathlib import Path
          lines = Path('/tmp/xg-log').read_text(errors='replace').splitlines()
          import re
          matches = [i for i, line in enumerate(lines) if '##[error]' in line]
          lines = [line for i in matches for line in lines[max(0, i-8):i+2]][-30:]
          text = '\n'.join(re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', line) for line in lines)
          print('::notice::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
  config:
    if: ${{ !inputs.DIAGNOSE }}
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      #max-parallel: 3
      matrix:
        CONFIG: [XG2010G]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [owrt]

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      WRT_THEME: vantage
      #默认主机名
      WRT_NAME: OWRT
      #默认WIFI名称
      WRT_SSID: OWRT
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}
